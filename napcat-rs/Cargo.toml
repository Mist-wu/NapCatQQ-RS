[workspace]
members = [
  "crates/core",
  "crates/protocol",
  "crates/message",
  "crates/api",
  "crates/plugin",
  "crates/storage",
  "crates/config",
  "crates/qq-client",
  "crates/cli",
  "tests",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["NapCatQQ-RS"]
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
thiserror = "2.0"
